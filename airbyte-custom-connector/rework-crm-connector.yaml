version: 3.9.6

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - deal

definitions:
  streams:
    deal:
      type: DeclarativeStream
      name: deal
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 1000
            start_from_page: 1
            inject_on_first_request: true
        requester:
          $ref: "#/definitions/base_requester"
          path: https://apis.{{domain}}/sales/v1/pipeline/deals
          http_method: POST
          request_body_data:
            password: your_password
            access_token: >-
              your_access_token
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - deals
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: "#/definitions/streams/pipeline"
              parent_key: id
              request_option:
                type: RequestOption
                field_name: id
                inject_into: body_data
              partition_field: id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/deal"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: last_update
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_datetime:
          type: MinMaxDatetime
          datetime: "2025-06-01T00:00:00Z"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        datetime_format: "%s"
        end_time_option:
          type: RequestOption
          field_name: last_update_stime
          inject_into: body_data
        start_time_option:
          type: RequestOption
          field_name: last_update_stime
          inject_into: body_data
        cursor_datetime_formats:
          - "%s"
    stage:
      type: DeclarativeStream
      name: stage
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
